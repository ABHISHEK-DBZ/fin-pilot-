version: "3.9"
# FINPILOT — optional deployment profile.
# The core demo runs fully embedded (node:sqlite) with no external services.
# This compose file provides the PostgreSQL deployment path described in the spec (section 18/19):
#   docker compose --profile pg up
services:
  postgres:
    image: postgres:17
    profile: "pg"
    environment:
      POSTGRES_USER: finpilot
      POSTGRES_PASSWORD: finpilot_dev_only
      POSTGRES_DB: finpilot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finpilot"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: node:22-alpine
    profile: "pg"
    working_dir: /app
    command: sh -c "npm ci && npm run seed && npm start"
    environment:
      FINPILOT_DB_PATH: /app/data/finpilot.db
      FINPILOT_DEMO_SEED: "2026"
      FINPILOT_PORT: "4310"
    ports:
      - "4310:4310"
    volumes:
      - .:/app

volumes:
  pgdata:
